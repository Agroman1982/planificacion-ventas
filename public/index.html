<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planificación Semanal de Ventas</title>
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ventas Rainbow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2733; --muted:#6b7686; --line:#e4e8f0;
    --brand:#1f6feb; --brand-d:#1858c4; --ok:#1a9d5a; --warn:#c9821a; --bad:#c0392b;
    --shadow:0 1px 3px rgba(20,30,50,.08),0 6px 20px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  .wrap{max-width:920px;margin:0 auto;padding:14px}
  h1{font-size:20px;margin:0}
  h2{font-size:16px;margin:0 0 10px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:600}
  button:hover{background:var(--brand-d)}
  button.ghost{background:#eef1f7;color:var(--ink)}
  button.ghost:hover{background:#e2e7f1}
  button.danger{background:var(--bad)}
  button.danger:hover{background:#a93226}
  button.small{padding:6px 10px;font-size:13px;border-radius:8px}
  input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:60px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
  .row-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .b-plan{background:#e8f0ff;color:#1f6feb}
  .b-curso{background:#fff3df;color:#c9821a}
  .b-ok{background:#e6f7ee;color:#1a9d5a}
  .b-no{background:#fdeaea;color:#c0392b}
  .muted{color:var(--muted)}
  .right{text-align:right}
  .center{text-align:center}
  /* login */
  .login{max-width:360px;margin:8vh auto}
  .login .card{padding:24px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
  /* header */
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .who{font-weight:700}
  .who .role{font-size:12px;color:var(--muted);font-weight:600}
  /* list */
  .act{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .act .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .act .who{font-size:12px}
  .act .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:8px}
  @media(max-width:560px){.act .meta{grid-template-columns:1fr}}
  .act .k{font-size:12px;color:var(--muted);font-weight:600}
  .act .v{font-size:14px}
  .money{font-variant-numeric:tabular-nums;font-weight:700}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,22,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:18px;box-shadow:var(--shadow);margin:4vh 0}
  .users td,.users th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px}
  .users{width:100%;border-collapse:collapse}
  .hide{display:none!important}
  .repWhoBox{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}
  input[readonly]{background:#f1f3f8;color:var(--muted);cursor:default}
  .pill{font-size:11px;padding:2px 7px;border-radius:999px;background:#eef1f7;color:var(--muted);font-weight:700}
  a.link{color:var(--brand);cursor:pointer;font-weight:600}
  .sum{font-size:13px;color:var(--muted)}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .cal-nav{display:flex;gap:6px;align-items:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
  .cal-cell{border:1px solid var(--line);border-radius:10px;min-height:88px;padding:4px;background:#fff;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .cal-cell.out{background:#fafbfd;opacity:.5}
  .cal-cell.today{outline:2px solid var(--brand);outline-offset:-2px}
  .cal-date{font-size:12px;font-weight:700;color:var(--muted)}
  .cal-chip{font-size:11px;line-height:1.2;padding:3px 6px;border-radius:7px;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-chip:hover{filter:brightness(.94)}
  .cal-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;font-size:12px;color:var(--muted)}
  .cal-dot{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  .cal-add{padding:0 4px}
  .det .k{font-size:12px;color:var(--muted);font-weight:600}
  .det .v{font-size:14px}
  @media(max-width:560px){.cal-cell{min-height:66px}.cal-dow{font-size:10px}.cal-date{font-size:11px}.cal-chip{font-size:10px;padding:2px 4px}.det{grid-template-columns:1fr}}
  .rtbl{border-collapse:collapse;width:100%;font-size:14px}
  .rtbl th,.rtbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
  .rtbl th{font-size:12px;color:var(--muted);font-weight:700;background:#fafbfd}
  .rtbl td.r,.rtbl th.r{text-align:right;font-variant-numeric:tabular-nums}
  .rtbl .rtot{font-weight:800;background:#f4f6fb}
  .rtbl tr:last-child td{border-bottom:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="card">
      <h1>Planificación de Ventas</h1>
      <p class="muted" style="margin:6px 0 16px">Inicia sesión para ver tu programación semanal.</p>
      <div class="grid">
        <div style="grid-column:1/-1">
          <label>Usuario</label>
          <input id="lu" autocomplete="username" placeholder="marco / hector">
        </div>
        <div style="grid-column:1/-1">
          <label>Contraseña</label>
          <input id="lp" type="password" autocomplete="current-password" placeholder="••••••">
        </div>
      </div>
      <button id="lbtn" style="width:100%;margin-top:14px">Entrar</button>
      <div id="lerr" class="err"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hide">
    <div class="topbar">
      <div>
        <div class="who" id="whoName">—</div>
        <div class="who"><span class="role" id="whoRole"></span></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost small hide" id="csvBtn">Exportar CSV</button>
        <button class="ghost small hide" id="usersBtn">Gestionar vendedores</button>
        <button class="ghost small" id="logoutBtn">Salir</button>
      </div>
    </div>

    <div class="card" id="banner"></div>

    <!-- Filtros -->
    <div class="card">
      <div class="grid">
        <div>
          <label>Filtrar por semana</label>
          <input id="fSemana" placeholder="Ej. Sem 42">
        </div>
        <div>
          <label>Filtrar por estado</label>
          <select id="fEstado">
            <option value="">Todos</option>
          </select>
        </div>
        <div id="adminOwnerWrap" class="hide" style="grid-column:1/-1">
          <label>Vendedor (vista administrador)</label>
          <select id="fOwner"></select>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="card" style="display:flex;gap:8px;align-items:center">
      <button id="tabList" class="small">Lista</button>
      <button id="tabCal" class="small ghost">Calendario</button>
      <button id="tabRes" class="small ghost">Resumen</button>
    </div>

    <!-- Formulario -->
    <div class="card" id="formCard">
      <div class="row-toolbar">
        <h2 id="formTitle">Nueva actividad</h2>
        <button class="ghost small hide" id="cancelEdit">Cancelar edición</button>
      </div>
      <div class="grid">
        <div>
          <label>Día</label>
          <input id="iDia" type="date">
        </div>
        <div>
          <label>Semana <span class="muted" style="font-weight:400">(automática)</span></label>
          <input id="iSemana" placeholder="Sem 42 (12-18 Oct)">
        </div>
        <div>
          <label>Ubicación</label>
          <input id="iUbicacion" placeholder="Zona / ruta / ciudad">
        </div>
        <div>
          <label>Cliente</label>
          <input id="iCliente" placeholder="Nombre del cliente">
        </div>
        <div>
          <label>Producto a promocionar</label>
          <input id="iProducto" placeholder="Ej: Bioinsumo X, Fungicida Y">
        </div>
        <div style="grid-column:1/-1">
          <label>Trabajo a realizar</label>
          <textarea id="iTrabajo" placeholder="Qué se va a hacer en la visita"></textarea>
        </div>
        <div>
          <label>Venta a concretar (US$)</label>
          <input id="iConcretar" type="number" step="0.01" min="0" placeholder="0.00">
        </div>
        <div>
          <label>Estado</label>
          <select id="iEstado"></select>
        </div>
        <div>
          <label>Venta realizada (US$)</label>
          <input id="iRealizada" type="number" step="0.01" min="0" placeholder="0.00">
        </div>
        <div id="repWrap" class="hide">
          <label>Representante</label>
          <select id="iRep"></select>
        </div>
        <div id="repWho" class="hide">
          <label>Representante</label>
          <div class="repWhoBox"><b id="repWhoName"></b> <span class="muted">(tú)</span></div>
        </div>
        <div style="grid-column:1/-1">
          <label>Observaciones</label>
          <textarea id="iObs" placeholder="Notas de lo ejecutado"></textarea>
        </div>
      </div>
      <button id="saveBtn" style="width:100%;margin-top:12px">Guardar actividad</button>
    </div>

    <div class="row-toolbar" id="listHead">
      <h2>Actividades <span class="sum" id="count"></span></h2>
    </div>
    <div id="list"></div>
    <div id="empty" class="card center muted hide">Sin actividades todavía.</div>

    <!-- Vista Calendario -->
    <div id="calView" class="hide"></div>

    <!-- Vista Resumen -->
    <div id="resView" class="hide"></div>
  </div>

  <!-- Modal detalle -->
  <div id="detailModal" class="overlay hide"></div>

  <!-- Modal usuarios -->
  <div id="usersModal" class="overlay hide">
    <div class="modal">
      <div class="row-toolbar">
        <h2>Vendedores y accesos</h2>
        <button class="ghost small" id="closeUsers">Cerrar</button>
      </div>
      <p class="muted" style="margin:0 0 10px">Agrega, renombra o retira vendedores. Al retirar, sus actividades se eliminan.</p>
      <table class="users" id="usersTable"></table>
      <h2 style="margin-top:18px">Agregar vendedor / administrador</h2>
      <div class="grid">
        <div><label>Nombre completo</label><input id="nName" placeholder="Ej. Luis Quispe"></div>
        <div><label>Usuario</label><input id="nUser" placeholder="luis"></div>
        <div><label>Rol</label>
          <select id="nRole">
            <option value="retail">Vendedor Retail</option>
            <option value="kam">KAM (vendedor Agroindustria)</option>
            <option value="supervisor">Supervisor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div><label>Supervisor (solo para vendedores)</label>
          <select id="nSup"><option value="">(sin supervisor)</option></select>
        </div>
        <div><label>Contraseña temporal</label><input id="nPass" placeholder="••••••"></div>
      </div>
      <button id="addUser" style="width:100%;margin-top:12px">Crear</button>
      <div id="uErr" class="err"></div>
    </div>
  </div>

</div>

<script>
(function(){
  var me=null, rows=[], ownerNames={}, estados=[], editingId=null, adminOwner='';
  var view='list', calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
  var resMetric='Realizado';
  var PALETTE=['#1f6feb','#1a9d5a','#c9821a','#8e44ad','#e0566f','#16a085','#d35400','#2c3e50','#2980b9','#27ae60'];
  function api(method, path, body){
    return fetch(path,{method:method,headers:{'Content-Type':'application/json'},
      credentials:'same-origin',body:body?JSON.stringify(body):undefined}).then(function(r){
      return r.json().then(function(j){ return {ok:r.ok, status:r.status, data:j}; });
    });
  }
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s));}
  function money(n){ n=Number(n)||0; return 'US$ '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function estadoBadge(e){
    var c='b-plan'; if(e==='En curso')c='b-curso'; else if(e==='Realizado')c='b-ok'; else if(e==='No realizado')c='b-no';
    return '<span class="badge '+c+'">'+esc(e)+'</span>';
  }

  // ---- init ----
  api('GET','/api/me').then(function(res){
    if(res.ok){ start(res.data.user, res.data.estados); }
    else { $('login').classList.remove('hide'); }
  });

  $('lbtn').onclick=doLogin;
  $('lp').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  function doLogin(){
    $('lerr').textContent='';
    api('POST','/api/login',{username:$('lu').value.trim(),password:$('lp').value}).then(function(res){
      if(res.ok){ start(res.data.user, estados); }
      else $('lerr').textContent=res.data.error||'No se pudo iniciar sesión';
    });
  }

  // Etiquetas de rol y helper: quién ve a varios vendedores (admin y supervisor)
  var ROLE_LABEL = {admin:'Administrador', supervisor:'Supervisor', retail:'Vendedor Retail', kam:'KAM (Agroindustria)'};
  function veVarios(){ return me && (me.role==='admin' || me.role==='supervisor'); }

  function start(user, ests){
    me=user; estados=ests||[];
    $('login').classList.add('hide');
    $('app').classList.remove('hide');
    $('whoName').textContent=me.name;
    $('whoRole').textContent= ROLE_LABEL[me.role] || me.role;
    // estado selects
    fillSelect($('iEstado'), estados, 'Planificado');
    fillSelect($('fEstado'), estados, '');
    if(me.role==='admin'){
      $('usersBtn').classList.remove('hide');   // gestionar vendedores: solo admin
      $('csvBtn').classList.remove('hide');     // exportar: admin y supervisor
      $('repWrap').classList.remove('hide');    // asignar actividad a otro: solo admin
    }
    if(veVarios()){
      $('csvBtn').classList.remove('hide');
      $('adminOwnerWrap').classList.remove('hide');
      // Poblar filtros de vendedor al entrar (sin cambiar el filtro activo: default "Todos")
      api('GET','/api/users').then(function(res){
        if(!res.ok) return;
        var us=res.data.users;
        // El supervisor solo ve a su equipo; el admin ve a todos.
        var visibles = me.role==='admin'
          ? us
          : us.filter(function(u){ return u.id===me.id || u.supervisorId===me.id; });
        fillSelect($('fOwner'), visibles.map(function(u){return u.id;}), '');
        visibles.forEach(function(u){ var o=$('fOwner').querySelector('option[value="'+u.id+'"]'); if(o)o.textContent=u.name; });
        $('fOwner').value='';
        var reps=us.filter(function(u){return u.role==='retail'||u.role==='kam';});
        fillSelect($('iRep'), reps.map(function(u){return u.id;}));
        reps.forEach(function(u){ var o=$('iRep').querySelector('option[value="'+u.id+'"]'); if(o)o.textContent=u.name; });
        if(reps[0]) $('iRep').value=reps[0].id;
      });
    } else {
      // Vendedor (retail / KAM): la actividad se asigna automáticamente a su cuenta (servidor).
      $('repWho').classList.remove('hide');
      $('repWhoName').textContent = me.name;
      // La semana se calcula desde la fecha: el vendedor no la puede editar (el admin sí).
      $('iSemana').readOnly = true;
      $('iSemana').title = 'Se calcula automáticamente al elegir el día';
    }
    $('banner').innerHTML = me.role==='admin'
      ? '<b>Modo administrador</b> — ves la programación de <b>todos</b> los vendedores. Usa el filtro de vendedor para ver uno solo.'
      : me.role==='supervisor'
        ? '<b>Modo supervisor</b> — ves la programación de <b>tu equipo</b> (los vendedores que tienes a cargo).'
        : 'Estás viendo <b>tu programación semanal</b>. Nadie más puede ver estas actividades.';
    loadRows();
  }

  function fillSelect(sel, opts, def){
    sel.innerHTML='';
    if(def!==undefined){ var o=document.createElement('option'); o.value=''; o.textContent= def===''?'Todos':def; sel.appendChild(o); }
    (opts||[]).forEach(function(t){ var o=document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); });
    if(def!==undefined && def!=='') sel.value=def;
  }

  // ---- semana automática a partir de la fecha ----
  var MES_ABBR = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  function parseFechaLocal(yyyymmdd){
    // "YYYY-MM-DD" -> Date local (medianoche), evita desfase por UTC.
    if(!yyyymmdd) return null;
    var p=yyyymmdd.split('-'); return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function lunesDeSemana(d){
    // Semana ISO = lunes a domingo. Devuelve el lunes de la semana que contiene a d.
    var day = d.getDay() || 7; // domingo -> 7
    var lun = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (day - 1));
    return lun;
  }
  function numSemanaISO(d){
    // Algoritmo estándar ISO-8601: número de semana del año al que pertenece el jueves de esa semana.
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dow = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dow);
    var yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil((((t - yearStart) / 86400000) + 1) / 7);
  }
  function etiquetaSemana(yyyymmdd){
    var d = parseFechaLocal(yyyymmdd); if(!d) return '';
    var lun = lunesDeSemana(d);
    var dom = new Date(lun.getFullYear(), lun.getMonth(), lun.getDate() + 6);
    var n = numSemanaISO(d);
    var rango;
    if(lun.getMonth() === dom.getMonth()){
      rango = lun.getDate() + '-' + dom.getDate() + ' ' + MES_ABBR[dom.getMonth()];
    } else {
      rango = lun.getDate() + ' ' + MES_ABBR[lun.getMonth()] + '-' + dom.getDate() + ' ' + MES_ABBR[dom.getMonth()];
    }
    return 'Sem ' + n + ' (' + rango + ')';
  }
  // Al elegir/cambiar la fecha, autollenar la semana (formato "Sem N (dd-dd Mmm)").
  document.addEventListener('DOMContentLoaded', function(){
    var dia = $('iDia'); if(!dia) return;
    dia.addEventListener('change', function(){
      var v = this.value; // "YYYY-MM-DD"
      if(!v) return;
      $('iSemana').value = etiquetaSemana(v);
    });
  });

  // ---- filtros ----
  ['fSemana','fEstado'].forEach(function(id){ $(id).addEventListener('input',loadRows); });
  $('fOwner').addEventListener('change',function(){ adminOwner=$('fOwner').value; loadRows(); });
  $('logoutBtn').onclick=function(){ api('POST','/api/logout').then(function(){ location.reload(); }); };

  // ---- cargar filas ----
  function loadRows(){
    var q=[];
    var s=$('fSemana').value.trim(); if(s) q.push('semana='+encodeURIComponent(s));
    var e=$('fEstado').value; if(e) q.push('estado='+encodeURIComponent(e));
    if(veVarios() && adminOwner) q.push('owner='+encodeURIComponent(adminOwner));
    api('GET','/api/rows'+(q.length?'?'+q.join('&'):'')).then(function(res){
      if(!res.ok) return;
      rows=res.data.rows||[]; ownerNames=res.data.ownerNames||{};
      renderRows();
      if(view==='cal') renderCalendar();
      if(view==='res') renderResumen();
    });
  }

  function renderRows(){
    var list=$('list'); list.innerHTML='';
    $('count').textContent='('+rows.length+')';
    $('empty').classList.toggle('hide', rows.length>0);
    rows.forEach(function(r){ list.appendChild(actCard(r)); });
  }

  function actCard(r){
    var d=document.createElement('div'); d.className='act';
    var hd=document.createElement('div'); hd.className='hd';
    var left=document.createElement('div');
    var who=document.createElement('div'); who.className='who muted';
    who.textContent= veVarios() ? (ownerNames[r.ownerId]||'—') : (esc(r.semana)||'Actividad');
    var sem=document.createElement('div'); sem.style.fontWeight='700'; sem.textContent= esc(r.semana)||'Sin semana';
    left.appendChild(sem); left.appendChild(who);
    var right=document.createElement('div');
    var st=document.createElement('span'); st.innerHTML=estadoBadge(r.estado); right.appendChild(st);
    hd.appendChild(left); hd.appendChild(right);

    var meta=document.createElement('div'); meta.className='meta';

  function renderCalendar(){
    var monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    var byDay={}, ownerIds=[];
    rows.forEach(function(r){
      if(!r.dia) return;
      var d=r.dia.slice(0,10);
      (byDay[d]=byDay[d]||[]).push(r);
      if(ownerIds.indexOf(r.ownerId)<0) ownerIds.push(r.ownerId);
    });
    ownerIds.sort();
    var ownerColor={}; ownerIds.forEach(function(id,i){ ownerColor[id]=PALETTE[i%PALETTE.length]; });
    var first=new Date(calYear,calMonth,1);
    var startDow=first.getDay();
    var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
    var todayStr=new Date().toISOString().slice(0,10);
    var cells=[]; for(var i=0;i<startDow;i++) cells.push(null);
    for(var d=1;d<=daysInMonth;d++) cells.push(d);
    while(cells.length%7!==0) cells.push(null);
    var html='<div class="cal-head"><div class="cal-nav">'
      +'<button class="ghost small" id="calPrev">‹</button>'
      +'<b style="min-width:130px;text-align:center">'+monthNames[calMonth]+' '+calYear+'</b>'
      +'<button class="ghost small" id="calNext">›</button></div>'
      +'<div style="display:flex;gap:8px;align-items:center">'
      +'<button class="ghost small" id="calToday">Hoy</button>';
    if(veVarios()){ html+='<select id="calOwner" class="small" style="max-width:190px"></select>'; }
    html+='</div></div>';
    html+='<div class="cal-grid">';
    ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].forEach(function(w){ html+='<div class="cal-dow">'+w+'</div>'; });
    cells.forEach(function(d){
      if(d===null){ html+='<div class="cal-cell out"></div>'; return; }
      var ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var cls='cal-cell'+(ds===todayStr?' today':'');
      html+='<div class="'+cls+'"><div style="display:flex;justify-content:space-between;align-items:center">'
        +'<span class="cal-date">'+d+'</span>'
        +'<span class="cal-add" data-day="'+ds+'" title="Agregar en este día" style="cursor:pointer;color:var(--brand);font-weight:700">+</span></div>';
      (byDay[ds]||[]).forEach(function(r){
        var color = veVarios() ? (ownerColor[r.ownerId]||'#888') : estadoColor(r.estado);
        var label = esc(r.cliente|| r.trabajo || 'Actividad');
        var tip = (veVarios()?(ownerNames[r.ownerId]||'')+' — ':'') + esc(r.cliente||'') + ' · ' + esc(r.estado);
        html+='<div class="cal-chip" data-rid="'+r.id+'" title="'+tip.replace(/"/g,'&quot;')+'" style="background:'+color+'">'+label+'</div>';
      });
      html+='</div>';
    });
    html+='</div>';
    if(veVarios()){
      html+='<div class="cal-legend">';
      ownerIds.forEach(function(id){ html+='<span><i class="cal-dot" style="background:'+ownerColor[id]+'"></i>'+(ownerNames[id]||id)+'</span>'; });
      html+='</div>';
    }
    $('calView').innerHTML=html;
    if(veVarios() && $('fOwner').options.length){
      var co=$('calOwner');
      co.innerHTML='';
      Array.prototype.forEach.call($('fOwner').options, function(o){ var op=document.createElement('option'); op.value=o.value; op.textContent=o.textContent; co.appendChild(op); });
      co.value=adminOwner;
      co.onchange=function(){ adminOwner=co.value; $('fOwner').value=adminOwner; loadRows(); };
    }
    $('calPrev').onclick=function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); };
    $('calNext').onclick=function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); };
    $('calToday').onclick=function(){ var t=new Date(); calYear=t.getFullYear(); calMonth=t.getMonth(); renderCalendar(); };
  }

  // ---- vista Resumen (totales) ----
  function pct(real, plan){ if(plan>0) return (real/plan*100); if(real>0) return 100; return 0; }
  function renderResumen(){
    if(!rows.length){ $('resView').innerHTML='<div class="card center muted">Sin actividades para resumir.</div>'; return; }
    var weeks={}; rows.forEach(function(r){ if(r.semana) weeks[r.semana]=1; });
    var weekList=Object.keys(weeks).sort();
    var aggP={}, aggR={}, vend={};
    rows.forEach(function(r){
      var vid=r.ownerId, w=r.semana||'—';
      aggP[vid]=aggP[vid]||{}; aggP[vid][w]=(aggP[vid][w]||0)+Number(r.ventaConcretar||0);
      aggR[vid]=aggR[vid]||{}; aggR[vid][w]=(aggR[vid][w]||0)+Number(r.ventaRealizada||0);
      vend[vid]=1;
    });
    var vendorIds=Object.keys(vend).sort();
    var single = (me.role!=='admin') || (adminOwner!=='');

    if(single && vendorIds.length){
      var vid=vendorIds[0];
      var vname = veVarios() ? (ownerNames[vid]||'—') : me.name;
      var html='<div class="row-toolbar"><h2>Resumen de '+esc(vname)+'</h2>'
        +'<button class="ghost small" id="resExport">Exportar a Excel</button></div>';
      html+='<h2 class="muted" style="font-size:14px;font-weight:700">Planificado vs Realizado por semana</h2>';
      html+='<table class="rtbl"><tr><th>Semana</th><th class="r">Planificado</th><th class="r">Realizado</th><th class="r">% Cumplimiento</th></tr>';
      var tP=0,tR=0;
      weekList.forEach(function(w){ var p=aggP[vid][w]||0, rl=aggR[vid][w]||0; tP+=p; tR+=rl;
        html+='<tr><td>'+esc(w)+'</td><td class="r">'+money(p)+'</td><td class="r">'+money(rl)+'</td><td class="r">'+pct(rl,p).toFixed(0)+'%</td></tr>'; });
      html+='<tr class="rtot"><td>Total del mes</td><td class="r">'+money(tP)+'</td><td class="r">'+money(tR)+'</td><td class="r">'+pct(tR,tP).toFixed(0)+'%</td></tr></table>';
      var byClient={};
      rows.forEach(function(r){ var c=r.cliente||'—'; if(!byClient[c]) byClient[c]={n:0,plan:0,real:0}; byClient[c].n++; byClient[c].plan+=Number(r.ventaConcretar||0); byClient[c].real+=Number(r.ventaRealizada||0); });
      html+='<h2 style="margin-top:16px">Total por cliente</h2>';
      html+='<table class="rtbl"><tr><th>Cliente</th><th class="r">Activ.</th><th class="r">Planificado</th><th class="r">Realizado</th><th class="r">% Cump.</th></tr>';
      Object.keys(byClient).sort().forEach(function(c){ var x=byClient[c]; html+='<tr><td>'+esc(c)+'</td><td class="r">'+x.n+'</td><td class="r">'+money(x.plan)+'</td><td class="r">'+money(x.real)+'</td><td class="r">'+pct(x.real,x.plan).toFixed(0)+'%</td></tr>'; });
      var gp=0,gr=0; Object.keys(byClient).forEach(function(c){ gp+=byClient[c].plan; gr+=byClient[c].real; });
      html+='<tr class="rtot"><td>Total</td><td class="r">—</td><td class="r">'+money(gp)+'</td><td class="r">'+money(gr)+'</td><td class="r">'+pct(gr,gp).toFixed(0)+'%</td></tr></table>';
      $('resView').innerHTML=html;
      $('resExport').onclick=exportResumen;
      return;
    }
    // matrix multi-vendor
    var metricOpts='<option value="Realizado">Realizado</option><option value="Planificado">Planificado</option><option value="Comparativo">Comparativo</option>';
    var html='<div class="row-toolbar"><h2>Venta total por vendedor y semana</h2>'
      +'<div style="display:flex;gap:6px;align-items:center"><span class="muted">Ver:</span>'
      +'<select id="resMetric" class="small">'+metricOpts+'</select>'
      +'<button class="ghost small" id="resExport">Exportar a Excel</button></div></div>';
    if(resMetric==='Comparativo'){
      html+='<div style="overflow-x:auto"><table class="rtbl"><tr><th>Vendedor</th><th class="r">Planificado (mes)</th><th class="r">Realizado (mes)</th><th class="r">% Cumplimiento</th></tr>';
      var gP=0,gR=0;
      vendorIds.forEach(function(vid){
        var p=0,r2=0; weekList.forEach(function(w){ p+=(aggP[vid][w]||0); r2+=(aggR[vid][w]||0); });
        gP+=p; gR+=r2; var nm=ownerNames[vid]||vid;
        html+='<tr><td>'+esc(nm)+'</td><td class="r">'+money(p)+'</td><td class="r">'+money(r2)+'</td><td class="r">'+pct(r2,p).toFixed(0)+'%</td></tr>';
      });
      html+='<tr class="rtot"><td>Total general</td><td class="r">'+money(gP)+'</td><td class="r">'+money(gR)+'</td><td class="r">'+pct(gR,gP).toFixed(0)+'%</td></tr></table></div>';
    } else {
      var field = resMetric==='Realizado' ? 'ventaRealizada' : 'ventaConcretar';
      var agg = resMetric==='Realizado' ? aggR : aggP;
      html+='<div style="overflow-x:auto"><table class="rtbl"><tr><th>Vendedor</th>';
      weekList.forEach(function(w){ html+='<th class="r">'+esc(w)+'</th>'; });
      html+='<th class="r">Total mes</th></tr>';
      var grandWeek={}, grandTotal=0;
      vendorIds.forEach(function(vid){
        var name=ownerNames[vid]||vid; var vt=0;
        html+='<tr><td>'+esc(name)+'</td>';
        weekList.forEach(function(w){ var s=agg[vid][w]||0; grandWeek[w]=(grandWeek[w]||0)+s; vt+=s; html+='<td class="r">'+money(s)+'</td>'; });
        grandTotal+=vt; html+='<td class="r rtot">'+money(vt)+'</td></tr>';
      });
      html+='<tr class="rtot"><td>Total general</td>';
      weekList.forEach(function(w){ html+='<td class="r">'+money(grandWeek[w]||0)+'</td>'; });
      html+='<td class="r">'+money(grandTotal)+'</td></tr>';
      html+='</table></div>';
    }
    $('resView').innerHTML=html;
    $('resMetric').value=resMetric;
    $('resMetric').onchange=function(){ resMetric=$('resMetric').value; renderResumen(); };
    $('resExport').onclick=exportResumen;
  }

  function exportResumen(){
    var D=';'; // separador para Excel en español
    function ef(n){ return (Number(n)||0).toFixed(2).replace('.',','); }
    function pc(rl,pl){ var v=pl>0?rl/pl*100:(rl>0?100:0); return v.toFixed(1).replace('.',',')+'%'; }
    var lines=[];
    var weeks={}; rows.forEach(function(r){ if(r.semana) weeks[r.semana]=1; });
    var weekList=Object.keys(weeks).sort();
    var single=(me.role!=='admin')||(adminOwner!=='');
    if(single && rows.length){
      var vid=veVarios()?adminOwner:me.id;
      var vname=veVarios()?(ownerNames[vid]||'—'):me.name;
      var bc={};
      rows.forEach(function(r){ var c=r.cliente||'—'; if(!bc[c]) bc[c]={n:0,p:0,rl:0}; bc[c].n++; bc[c].p+=Number(r.ventaConcretar||0); bc[c].rl+=Number(r.ventaRealizada)||0; });
      lines.push('Resumen de '+vname);
      lines.push('Cliente'+D+'Actividades'+D+'Planificado'+D+'Realizado'+D+'% Cumplimiento');
      Object.keys(bc).sort().forEach(function(c){ var x=bc[c]; lines.push([c,x.n,ef(x.p),ef(x.rl),pc(x.rl,x.p)].join(D)); });
    } else if(rows.length){
      if(resMetric==='Comparativo'){
        lines.push('Venta total por vendedor (Comparativo)');
        lines.push('Vendedor'+D+'Planificado'+D+'Realizado'+D+'% Cumplimiento');
        var aggP2={},aggR2={};
        rows.forEach(function(r){ aggP2[r.ownerId]=aggP2[r.ownerId]||{}; aggP2[r.ownerId][r.semana]=(aggP2[r.ownerId][r.semana]||0)+Number(r.ventaConcretar||0); aggR2[r.ownerId]=aggR2[r.ownerId]||{}; aggR2[r.ownerId][r.semana]=(aggR2[r.ownerId][r.semana]||0)+Number(r.ventaRealizada||0); });
        var gP=0,gR=0;
        Object.keys(aggP2).sort().forEach(function(vid){ var p=0,r2=0; weekList.forEach(function(w){ p+=(aggP2[vid][w]||0); r2+=(aggR2[vid][w]||0); }); gP+=p; gR+=r2; lines.push([ownerNames[vid]||vid,ef(p),ef(r2),pc(r2,p)].join(D)); });
        lines.push(['Total general',ef(gP),ef(gR),pc(gR,gP)].join(D));
      } else {
        var field=resMetric==='Realizado'?'ventaRealizada':'ventaConcretar';
        lines.push('Venta total por vendedor y semana ('+resMetric+')');
        lines.push(['Vendedor'].concat(weekList).concat(['Total mes']).join(D));
        var agg3={}; rows.forEach(function(r){ agg3[r.ownerId]=agg3[r.ownerId]||{}; agg3[r.ownerId][r.semana]=(agg3[r.ownerId][r.semana]||0)+Number(r[field]||0); });
        Object.keys(agg3).sort().forEach(function(vid){ var vt=0; var row=[ownerNames[vid]||vid]; weekList.forEach(function(w){ var s=agg3[vid][w]||0; vt+=s; row.push(ef(s)); }); row.push(ef(vt)); lines.push(row.join(D)); });
      }
    }
    if(!lines.length) return;
    var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='resumen_ventas.csv'; a.click();
  }

  function showRes(){
    view='res';
    $('tabRes').classList.remove('ghost'); $('tabList').classList.add('ghost'); $('tabCal').classList.add('ghost');
    $('formCard').classList.add('hide'); $('listHead').classList.add('hide');
    $('list').classList.add('hide'); $('empty').classList.add('hide');
    $('calView').classList.add('hide'); $('resView').classList.remove('hide');
    renderResumen();
  }

})();
</script>
