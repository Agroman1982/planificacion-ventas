<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rainbow Platform</title>
<meta name="theme-color" content="#1B755E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{ --bg:#1B755E; --card:#fff; --ink:#0F172A; --muted:#334155; --line:#B9C6C2; --brand:#1D4ED8; --brand-d:#1A45B8; --ok:#15803D; --warn:#B45309; --bad:#B91C1C; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  .wrap{max-width:920px;margin:0 auto;padding:14px}
  h1{font-size:20px;margin:0}
  h2{font-size:16px;margin:0 0 10px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:600}
  button:hover{background:var(--brand-d)}
  button.ghost{background:#E9EDF4;color:var(--ink)}
  button.small{padding:6px 10px;font-size:13px;border-radius:8px}
  input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:60px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .hide{display:none!important}
  .login{max-width:360px;margin:8vh auto}
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
  .muted{color:var(--muted)}
  .act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer}
  .act .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .act .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:8px}
  @media(max-width:560px){.act .meta{grid-template-columns:1fr}}
  .act .k{font-size:12px;color:var(--muted);font-weight:600}
  .act .v{font-size:14px}
  .money{font-variant-numeric:tabular-nums;font-weight:700}
  .overlay{position:fixed;inset:0;background:rgba(15,22,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:18px;margin:4vh 0}
  .module-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));gap:16px;margin-top:14px}
  .module-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:transform .1s}
  .module-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .module-icon{font-size:32px;margin-bottom:8px}
  .module-name{font-size:16px;font-weight:700;margin-bottom:4px}
  .module-desc{font-size:13px;color:var(--muted)}
  .tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:10px 10px 0 0;background:#E9EDF4;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line);border-bottom:none}
  .tab.active{background:var(--card);color:var(--ink);border-bottom:1px solid var(--card);position:relative;z-index:1}
  .eval-editor{border:1px solid var(--line);border-radius:10px;padding:12px;background:#f8f9fa}
  .eval-list{margin-bottom:4px}
  .cal-scroll{overflow-x:auto}
  .cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;min-width:620px}
  .cal-mday-h{text-align:center;font-weight:700;font-size:11px;color:var(--muted);padding:4px 0}
  .cal-mday{background:#f8f9fa;border-radius:8px;min-height:92px;padding:4px;font-size:11px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal-mday.out{background:#eef2f6;opacity:.55}
  .cal-mday.today{border:2px solid var(--brand);background:#eef4ff}
  .cal-mday.weekend{background:#fdf1f5}
  .cal-mday.today.weekend{background:#eef4ff}
  .cal-mday .dnum{font-weight:700;font-size:11px;color:var(--muted)}
  .cal-mday.today .dnum{color:var(--brand)}
  .cal-chip{display:block;padding:2px 6px;border-radius:6px;font-size:10px;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .cal-chip:hover{opacity:.85}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
  .cronograma .card,div.card.cronograma{background:#fff;color:#0F172A}
  .crono-panel{animation:cronoApertura .18s ease}
  @keyframes cronoApertura{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .cronograma ::-webkit-scrollbar{height:8px}
  .cronograma ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
  /* Herramientas del modulo Ventas (integradas en la app unificada) */
  .vt-toolbar{padding:12px 14px}
  .vt-botones{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .vt-etiqueta{font-size:12px;font-weight:600;margin-right:2px}
  .vt-filtros{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .vt-botones button.vt-activo{background:var(--brand);color:#fff}
  #vtModal{max-width:760px}
  .vt-modal-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .vt-err{font-size:13px;min-height:18px;margin-top:8px;color:var(--bad)}
  .vt-check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:6px 0 12px}
  .vt-check input{width:auto}
  .vt-panel{background:#F1F7F4;border:1px solid var(--line);border-radius:12px;padding:12px}
  .vt-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:560px){.vt-meta-grid{grid-template-columns:1fr 1fr}}
  .vt-meta-grid div{display:flex;flex-direction:column;gap:2px}
  .vt-meta-grid span{font-size:11px;color:var(--muted);font-weight:600}
  .vt-meta-grid b{font-size:15px}
  .vt-tbl{border-collapse:collapse;width:100%;font-size:13px}
  .vt-tbl th,.vt-tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
  .vt-tbl th{background:#F1F5F9;font-size:12px;color:var(--muted)}
  .vt-tbl .r,.vt-tbl td.r{text-align:right}
  .vt-tbl tr.vt-total td{font-weight:700;background:#F1F5F9}
  .vt-tbl input{width:110px;padding:5px 8px;font-size:13px}
  .vt-tbl button{margin:1px 0}
  .vt-todo{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;flex-wrap:wrap}
  .vt-todo-info{font-size:13px;flex:1;min-width:180px}
  .vt-todo-info b{font-size:14px}
  .vt-todo-info div{color:var(--muted)}
  .vt-todo-acc{display:flex;gap:6px}
  .vt-scroll{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
  .vt-cat-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 6px;border-bottom:1px solid var(--line);font-size:13px}
  .vt-cat-row:last-child{border-bottom:none}
  .vt-nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
  /* Identidad del representante (solo Planificacion de Ventas) */
  .vt-who{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#F1F5FA;border:1px solid var(--line);border-bottom:4px solid var(--bg);border-radius:12px;padding:10px 16px;margin-bottom:14px}
  .vt-who-name{font-size:20px;font-weight:800;line-height:1.15;color:var(--ink)}
  .vt-who-role{font-size:12px;color:var(--muted);margin-top:2px}
  .vt-who-mod{font-size:12px;font-weight:700;color:var(--bg)}
  /* Calendario: + por dia, marcas de estado y leyenda de representantes */
  .cal-dayhd{display:flex;justify-content:space-between;align-items:center;gap:4px}
  .cal-add{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;color:var(--brand);font-weight:800;font-size:15px;line-height:1;cursor:pointer;user-select:none}
  .cal-add:hover{background:#dbeafe}
  .cal-mark{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;min-width:13px;border-radius:50%;font-size:9px;font-weight:800;line-height:1;margin-right:3px;background:#fff;vertical-align:middle}
  .cal-mark.ok{color:#15803D}
  .cal-mark.no{color:#B91C1C}
  .cal-leyenda-reps{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
  .cal-leyenda-reps i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="card">
      <h1>Rainbow Platform</h1>
      <p class="muted" style="margin:6px 0 16px">Inicia sesion para acceder a los modulos.</p>
      <div class="grid">
        <div style="grid-column:1/-1">
          <label>Usuario</label>
          <input id="lu" autocomplete="username" placeholder="hector">
        </div>
        <div style="grid-column:1/-1">
          <label>Contrase&ntilde;a</label>
          <input id="lp" type="password" autocomplete="current-password" placeholder="------">
        </div>
      </div>
      <button id="lbtn" style="width:100%;margin-top:14px">Entrar</button>
      <div id="lerr" class="muted" style="color:var(--bad);font-size:13px;margin-top:8px;min-height:18px"></div>
    </div>
  </div>

  <!-- MODULE SELECTOR -->
  <div id="moduleSelector" class="hide">
    <div class="topbar">
      <div>
        <div style="font-weight:700;font-size:18px" id="whoName">&mdash;</div>
        <div style="font-size:13px;color:var(--muted)" id="whoRole"></div>
      </div>
      <button class="ghost small" id="logoutBtn">Salir</button>
    </div>
    <div class="card">
      <h2>Selecciona un modulo</h2>
      <div class="module-grid" id="moduleGrid"></div>
    </div>
  </div>

  <!-- MODULE VIEW -->
  <div id="moduleView" class="hide">
    <!-- Nombre del representante y rol: solo se muestra en Planificacion de Ventas -->
    <div id="vtWhoCard" class="vt-who hide">
      <div>
        <div class="vt-who-name" id="vtWhoName">&mdash;</div>
        <div class="vt-who-role" id="vtWhoRole"></div>
      </div>
      <div class="vt-who-mod" id="vtWhoModule"></div>
    </div>
    <div class="topbar">
      <div>
        <div style="font-weight:700;font-size:18px" id="moduleTitle">&mdash;</div>
        <div style="font-size:13px;color:var(--muted)" id="moduleSubtitle"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="moduleSwitch" style="width:auto;min-width:190px;font-size:13px;padding:6px 8px" aria-label="Modulo activo"></select>
        <button class="ghost small" id="backBtn">Modulos</button>
        <button class="ghost small" id="logoutBtn2">Salir</button>
      </div>
    </div>

    <!-- Herramientas exclusivas de Planificacion de Ventas -->
    <div id="vtToolbar"></div>

    <!-- Tabs de vistas -->
    <div id="viewTabs" class="tabs"></div>

    <!-- Vista activa -->
    <div id="viewContainer"></div>

    <!-- Formulario (siempre visible o colapsable) -->
    <div class="card" id="formCard">
      <h2 id="formTitle">Nuevo registro</h2>
      <div id="dynamicForm"></div>
      <button id="saveBtn" style="width:100%;margin-top:12px">Guardar</button>
    </div>
  </div>

  <!-- DETAIL MODAL -->
  <div id="detailModal" class="overlay hide">
    <div class="modal" id="detailModalBox" style="max-width:760px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2>Detalle</h2>
        <button class="ghost small" id="closeDetail">Cerrar</button>
      </div>
      <div id="detailContent"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="editBtn" style="flex:1">Editar</button>
        <button class="ghost" id="deleteBtn" style="flex:1;background:var(--bad);color:#fff">Eliminar</button>
      </div>
    </div>
  </div>

</div>

<script src="js/modules.js?v=__BUILD__"></script>
<script src="js/clientes-autocomplete.js?v=__BUILD__"></script>
<script src="js/renderer.js?v=__BUILD__"></script>
<script src="js/xlsx.js?v=__BUILD__"></script>
<script src="js/ventas-tools.js?v=__BUILD__"></script>
<script>
(function(){
  var me=null, currentModule='ventas', moduleSchema=null, rows=[], ownerNames={}, moduleUsers=[], editingId=null;
  var currentView='lista';
  var ROLES_TXT={admin:'Administrador',supervisor:'Supervisor',coordinador:'Coordinador',
    retail:'Vendedor Retail',kam:'KAM (Agroindustria)',promotor:'Promotor'};

  // Modulos que conservan el diseno de vista unica: el formulario "Nuevo registro"
  // arriba y, debajo, la lista de registros en una tarjeta con buscador y boton de
  // exportar. Es el diseno que tenia el modulo de Ventas antes del rediseno de I+D.
  var VISTA_UNICA=['ventas'];

  function esVistaUnica(){
    return VISTA_UNICA.indexOf(currentModule)>=0;
  }

  function api(method, path, body){
    return fetch(path,{method:method,headers:{'Content-Type':'application/json'},
      credentials:'same-origin',body:body?JSON.stringify(body):undefined}).then(function(r){
      return r.json().then(function(j){ return {ok:r.ok, status:r.status, data:j}; });
    });
  }
  function $(id){return document.getElementById(id);}
  function esc(s){return s==null?'':String(s);}

  // Login
  $('lbtn').onclick=doLogin;
  $('lp').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

  function doLogin(){
    $('lerr').textContent='';
    api('POST','/api/login',{username:$('lu').value.trim(),password:$('lp').value}).then(function(res){
      if(res.ok){ start(res.data.user); }
      else $('lerr').textContent=res.data.error||'Error de login';
    });
  }

  function start(user){
    me=user;
    $('login').classList.add('hide');
    $('whoName').textContent=me.name;
    $('whoRole').textContent=ROLES_TXT[me.role]||me.role;
    // Tarjeta superior con el nombre del representante y su rol (solo Ventas).
    $('vtWhoName').textContent=me.name||me.username||'—';
    $('vtWhoRole').textContent=ROLES_TXT[me.role]||me.role||'—';
    if(window.RainbowClientes) RainbowClientes.cargar(); // listado maestro de clientes

    // Puente entre la app modular y las herramientas de Ventas.
    window.__RB={
      api:api, $:$, esc:esc, toast:toast,
      me:function(){ return me; }, rows:function(){ return rows; },
      ownerNames:function(){ return ownerNames; }, module:function(){ return currentModule; },
      schema:function(){ return moduleSchema; }, render:function(){ renderCurrentView(); },
      renderForm:function(){ renderForm(); }, loadRows:function(){ loadRows(); },
      openDetail:function(id){ openDetail(id); }
    };
    if(window.VentasTools) VentasTools.init(window.__RB);

    // El enlace de siempre entra DIRECTAMENTE a Ventas; el selector de la
    // cabecera permite cambiar a I+D o Marketing sin salir de la app.
    loadModules(true);
  }

  function loadModules(abrirPorDefecto){
    api('GET','/api/modules').then(function(res){
      if(!res.ok) return;
      var modules=res.data.modules||[];
      var grid=$('moduleGrid');
      grid.innerHTML='';
      modules.forEach(function(mod){
        var card=document.createElement('div');
        card.className='module-card';
        card.innerHTML='<div class="module-icon">'+esc(mod.icon)+'</div><div class="module-name">'+esc(mod.name)+'</div><div class="module-desc">'+esc(mod.description||'')+'</div>';
        card.onclick=function(){ openModule(mod.id); };
        grid.appendChild(card);
      });
      var sel=$('moduleSwitch');
      if(sel){
        sel.innerHTML='';
        modules.forEach(function(mod){
          var o=document.createElement('option');
          o.value=mod.id;
          o.textContent=(mod.icon?mod.icon+' ':'')+mod.name;
          sel.appendChild(o);
        });
        sel.value='ventas';
      }
      if(abrirPorDefecto && modules.some(function(m){ return m.id==='ventas'; })) openModule('ventas');
    });
  }

  function openModule(moduleId){
    currentModule=moduleId;
    $('moduleSelector').classList.add('hide');
    $('moduleView').classList.remove('hide');
    if($('moduleSwitch')) $('moduleSwitch').value=moduleId;
    // La tarjeta de nombre + rol es exclusiva del modulo de Ventas.
    $('vtWhoCard').classList.toggle('hide', moduleId!=='ventas');
    if(window.VentasTools) VentasTools.onModuleChange(moduleId);

    api('GET','/api/modules/'+moduleId+'/schema').then(function(res){
      if(res.ok){
        moduleSchema=res.data;
        $('moduleTitle').textContent=moduleSchema.name;
        $('vtWhoModule').textContent=moduleSchema.name;
        // El modulo de Ventas conserva el subtitulo original.
        $('moduleSubtitle').textContent=esVistaUnica()?'Módulo activo':'Modulo activo';
        // Cargar usuarios para userselect
        if(res.data.users && Array.isArray(res.data.users)){
          moduleUsers=res.data.users;
          if(window.ModuleRenderer) ModuleRenderer.users=moduleUsers;
        }
        // Determinar vista inicial
        var views=moduleSchema.schema.views||{};
        var firstView='lista';
        for(var k in views){ if(views[k].enabled){ firstView=k; break; } }
        currentView=firstView;
        renderTabs();
        renderForm();
        loadRows();
      }
    });
  }

  function renderTabs(){
    var views=moduleSchema.schema.views||{};
    var tabsDiv=$('viewTabs');
    tabsDiv.innerHTML='';
    // Los modulos de vista unica (Ventas) no muestran barra de pestanas.
    if(esVistaUnica()){ tabsDiv.style.display='none'; return; }
    tabsDiv.style.display='';
    for(var viewKey in views){
      if(!views[viewKey].enabled) continue;
      (function(key, v){
        var tab=document.createElement('div');
        tab.className='tab'+(key===currentView?' active':'');
        tab.textContent=v.icon? v.icon+' '+v.label : v.label;
        tab.onclick=function(){
          currentView=key;
          renderTabs();
          renderCurrentView();
        };
        tabsDiv.appendChild(tab);
      })(viewKey, views[viewKey]);
    }
  }

  function renderForm(){
    ModuleRenderer.renderForm('dynamicForm', moduleSchema, {}, me.role==='admin');
    if(window.VentasTools) VentasTools.decorarFormulario();
  }

  function loadRows(){
    api('GET','/api/modules/'+currentModule+'/rows').then(function(res){
      if(!res.ok) return;
      rows=res.data.rows||[];
      ownerNames=res.data.ownerNames||{};
      if(res.data.users && Array.isArray(res.data.users)){
        moduleUsers=res.data.users;
        if(window.ModuleRenderer) ModuleRenderer.users=moduleUsers;
      }
      renderCurrentView();
    });
  }

  function renderCurrentView(){
    // Las herramientas de Ventas pueden pedir un redibujado antes de que el
    // schema del modulo haya llegado; en ese caso no hay nada que pintar aun.
    if(!moduleSchema) return;
    var container=$('viewContainer');
    container.innerHTML='';

    // Ubicacion del formulario "Nuevo registro":
    //  - vista unica (Ventas): va ARRIBA, antes de la lista (diseno original).
    //  - modulos con pestanas (I+D): va ABAJO de la vista activa.
    var mv=$('moduleView');
    var formCard=$('formCard');
    if(esVistaUnica()){
      if(formCard.nextElementSibling!==container) mv.insertBefore(formCard, container);
    } else if(mv.lastElementChild!==formCard){
      mv.appendChild(formCard);
    }

    // Los modulos de vista unica conservan su propia estructura.
    if(esVistaUnica()){
      renderVistaUnica();
      return;
    }

    // El formulario "Nuevo registro" solo se muestra en la pestana Lista.
    // En Calendario, Cronograma y Resumen queda solo el contenido de la vista.
    $('formCard').style.display=(currentView==='lista')?'':'none';

    // Barra de herramientas (buscar + exportar)
    var toolbar=document.createElement('div');
    toolbar.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap';
    var searchInput=document.createElement('input');
    searchInput.placeholder='Buscar...';
    searchInput.style.flex='1';
    searchInput.id='searchInput';
    toolbar.appendChild(searchInput);

    // Botones de exportacion
    var exportBtn=document.createElement('button');
    exportBtn.className='ghost small';
    exportBtn.textContent='Exportar a Excel';
    exportBtn.onclick=exportToList;
    toolbar.appendChild(exportBtn);

    if(currentModule==='i-d'){
      var cronBtn=document.createElement('button');
      cronBtn.className='ghost small';
      cronBtn.textContent='Cronograma Excel';
      cronBtn.onclick=exportCronograma;
      toolbar.appendChild(cronBtn);

      var compBtn=document.createElement('button');
      compBtn.className='ghost small';
      compBtn.textContent='Cumplimiento';
      compBtn.onclick=exportCumplimiento;
      toolbar.appendChild(compBtn);

      var resBtn=document.createElement('button');
      resBtn.className='ghost small';
      resBtn.textContent='Resumen ejec.';
      resBtn.onclick=exportResumenEjec;
      toolbar.appendChild(resBtn);
    }

    container.appendChild(toolbar);

    // Contenedor de la vista

  // Calendario: vista de mes completo (no semanal).
  function renderCalendarView(container){
    var states=moduleSchema.schema.states||{};
    var stateColors=states.colors||{};
    var fields=moduleSchema.schema.fields||[];
    var cfg=(moduleSchema.schema.views&&moduleSchema.schema.views.calendario)||{};
    var colorBy=cfg.colorBy||(states.field||'estado');
    var dateField=cfg.dateField||(fields.some(function(f){return f.name==='dia';})?'dia':null);
    var titleField=['producto','cliente','nombre','trabajo'].filter(function(n){
      return fields.some(function(f){return f.name===n;});
    })[0]||(fields.filter(function(f){return f.type==='text';})[0]||{}).name;

    // Fecha en formato ISO pero basada en hora local (evita el corrimiento de zona horaria)
    function isoLocal(d){
      var m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2);
      return d.getFullYear()+'-'+m+'-'+day;
    }
    function corto(s,max){
      s=String(s||'').replace(/\s*\(.*$/,'');
      return s.length>max?s.slice(0,max-1)+'\u2026':s;
    }
    // Eventos de una fila: hito principal + hitos de actividades (I+D)
    function eventosDeFila(row){
      var ev=[];
      var base=row[titleField]||'';
      var col=stateColors[row[colorBy]]||'#1976d2';
      if(dateField&&row[dateField]){
        var sufijo=(currentModule==='i-d')?' \u00b7 inst.':'';
        ev.push({date:row[dateField],label:corto(base,13)+sufijo,color:col,
                 title:base+' \u2014 '+(currentModule==='i-d'?'Instalacion del ensayo':dateField)+' ('+row[dateField]+')'});
      }
      if(currentModule==='i-d'){
        if(row.fechaMuestras){
          ev.push({date:row.fechaMuestras,label:corto(base,13)+' \u00b7 muest.',color:'#fbc02d',
                   title:base+' \u2014 Solicitud de muestras ('+row.fechaMuestras+')'});
        }
        if(Array.isArray(row.evaluaciones)){
          row.evaluaciones.forEach(function(e,i){
            var d=e.fechaReal||e.fechaPlanificada;
            if(!d) return;
            ev.push({date:d,label:corto(base,13)+' \u00b7 E'+(i+1),
                     color:e.estado==='Realizada'?'#2e7d32':'#fbc02d',
                     title:base+' \u2014 '+(e.tipo||('Evaluacion '+(i+1)))+' ('+d+')'});
          });
        }
        if(row.fechaInformePlanificada){
          ev.push({date:row.fechaInformePlanificada,label:corto(base,13)+' \u00b7 inf.',color:'#7b1fa2',
                   title:base+' \u2014 Informe ('+row.fechaInformePlanificada+')'});
        }
      }
      return ev;
    }

    var today=new Date();
    var todayISO=isoLocal(today);
    var viewYear=today.getFullYear(), viewMonth=today.getMonth();

    var calDiv=document.createElement('div');
    calDiv.className='card';

    var nav=document.createElement('div');
    nav.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px';
    var prevBtn=document.createElement('button');
    prevBtn.className='ghost small';
    prevBtn.textContent='\u2190 Anterior';
    var monthLabel=document.createElement('div');
    monthLabel.style.cssText='font-weight:700;font-size:16px;flex:1;text-align:center';
    var hoyBtn=document.createElement('button');
    hoyBtn.className='ghost small';
    hoyBtn.textContent='Hoy';
    var nextBtn=document.createElement('button');
    nextBtn.className='ghost small';
    nextBtn.textContent='Siguiente \u2192';
    nav.appendChild(prevBtn);
    nav.appendChild(monthLabel);
    nav.appendChild(hoyBtn);
    nav.appendChild(nextBtn);
    calDiv.appendChild(nav);

    if(!dateField&&currentModule!=='i-d'){
      var hint=document.createElement('div');
      hint.className='muted';
      hint.style.cssText='font-size:12px;text-align:center;padding:14px';
      hint.textContent='Este modulo no tiene fechas para mostrar en el calendario.';
      calDiv.appendChild(hint);
    }

    var scroll=document.createElement('div');
    scroll.className='cal-scroll';
    var gridEl=document.createElement('div');
    gridEl.className='cal-month';
    scroll.appendChild(gridEl);
    calDiv.appendChild(scroll);

    // Leyenda de colores
    var legend=document.createElement('div');
    legend.className='cal-legend';
    legend.innerHTML='<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#fbc02d;margin-right:3px"></span> Muestras / Evaluacion pendiente</span>'
      +'<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#2e7d32;margin-right:3px"></span> Evaluacion realizada</span>'
      +'<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7b1fa2;margin-right:3px"></span> Informe</span>'
      +'<span><span style="display:inline-block;width:18px;height:10px;border-radius:3px;background:linear-gradient(90deg,#1976d2,#66bb6a,#2e7d32);margin-right:3px"></span> Hito principal (color = estado del ensayo)</span>';
    calDiv.appendChild(legend);

    container.appendChild(calDiv);

    var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    // Se calculan los eventos una sola vez por fila (no por celda)
    var eventosPorFila=rows.map(function(r){ return eventosDeFila(r); });

    function renderCal(){
      gridEl.innerHTML='';
      monthLabel.textContent=MESES[viewMonth]+' '+viewYear;

      // La semana empieza en Domingo y termina en Sabado (ambos modulos).
      ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'].forEach(function(dn){
        var dh=document.createElement('div');
        dh.className='cal-mday-h';
        dh.textContent=dn;
        gridEl.appendChild(dh);
      });

      var first=new Date(viewYear,viewMonth,1);
      var offset=first.getDay();   // 0 = domingo, por lo que no hay corrimiento
      var start=new Date(viewYear,viewMonth,1-offset);

      for(var i=0;i<42;i++){
        var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
        var iso=isoLocal(d);
        var cell=document.createElement('div');
        cell.className='cal-mday'
          +(d.getMonth()!==viewMonth?' out':'')
          +(iso===todayISO?' today':'')
          +((d.getDay()===0||d.getDay()===6)?' weekend':'');
        var num=document.createElement('div');
        num.className='dnum';
        num.textContent=d.getDate();
        cell.appendChild(num);

        eventosPorFila.forEach(function(evs, ri){
          evs.forEach(function(ev){
            if(ev.date!==iso) return;
            var chip=document.createElement('span');
            chip.className='cal-chip';
            chip.style.background=ev.color;
            chip.textContent=ev.label;
            chip.title=ev.title;
            chip.onclick=function(){ openDetail(rows[ri].id); };
            cell.appendChild(chip);
          });
        });

        gridEl.appendChild(cell);
      }
    }

    prevBtn.onclick=function(){
      viewMonth--;
      if(viewMonth<0){ viewMonth=11; viewYear--; }
      renderCal();
    };
    nextBtn.onclick=function(){
      viewMonth++;
      if(viewMonth>11){ viewMonth=0; viewYear++; }
      renderCal();
    };
    hoyBtn.onclick=function(){
      viewYear=today.getFullYear();
      viewMonth=today.getMonth();
      renderCal();
    };
    renderCal();
  }

  function openDetail(rowId){
    var row=rows.find(function(r){ return r.id===rowId; });
    if(!row) return;

    var content=$('detailContent');
    content.innerHTML='';

    // Para I+D usamos el detalle con informacion basica + timeline de ACTIVIDADES
    if(currentModule==='i-d'){
      var canEdit=(me.role==='admin'||me.role==='supervisor'||me.role==='coordinador'
        ||row.representante===me.id||row.campo1Rtc===me.id||row.campo2Rtc===me.id);

      function drawID(currentRow){
        content.innerHTML='';
        var detail=ModuleRenderer.renderIDDetail(currentRow, moduleSchema, moduleUsers, canEdit ? function(changes){
          var payload=ModuleRenderer.buildIDUpdatePayload(currentRow, changes);
          api('PUT','/api/modules/'+currentModule+'/rows/'+currentRow.id, payload).then(function(res){
            if(res.ok){
              var updated=res.data.row;
              var idx=rows.findIndex(function(r){ return r.id===currentRow.id; });
              if(idx>=0) rows[idx]=updated;
              drawID(updated);       // refleja check, fecha y estado derivado
              loadRows();            // refresca lista agrupada / dashboard
              toast('Actualizado');
            } else {
              alert(res.data.error||'Error al actualizar');
            }
          });
        } : null);
        content.appendChild(detail);
      }
      drawID(row);

      $('editBtn').style.display=canEdit?'':'none';
      $('deleteBtn').style.display=(me.role==='admin'||me.role==='supervisor')?'':'none';

      $('detailModal').classList.remove('hide');
      editingId=rowId;
      return;
    }

    // Vista generica para otros modulos
    moduleSchema.schema.fields.forEach(function(field){
      var div=document.createElement('div');
      div.style.marginBottom='10px';
      var label=document.createElement('div');
      label.className='k';
      label.textContent=field.label;
      var value=document.createElement('div');
      value.className='v';

      if(field.type==='evaluations'){
        if(Array.isArray(row[field.name]) && row[field.name].length){
          value.innerHTML='';
          row[field.name].forEach(function(ev,i){
            var evDiv=document.createElement('div');
            evDiv.style.cssText='padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px';
            var estadoColor=ev.estado==='Realizada'?'#2e7d32':(ev.estado==='No realizada'?'#c62828':(ev.estado==='Pospuesta'?'#fbc02d':'#666'));
            evDiv.innerHTML='<b>'+esc(ev.tipo||'Evaluacion '+(i+1))+'</b>'
              +' <span class="badge" style="background:'+estadoColor+'">'+esc(ev.estado)+'</span>'
              +'<br>Planif.: '+esc(ev.fechaPlanificada||'—')+' | Real.: '+esc(ev.fechaReal||'—');
            if(ev.observaciones) evDiv.innerHTML+='<div class="muted" style="margin-top:4px">'+esc(ev.observaciones)+'</div>';
            value.appendChild(evDiv);
          });
        } else {
          value.textContent='Sin evaluaciones definidas';
        }
      } else if(field.type==='userselect'){
        var u=moduleUsers.find(function(x){ return x.id===row[field.name]; });
        value.textContent=u?u.name:'\u2014';
      } else if(field.type==='number'){
        value.innerHTML='<span class="money">US$ '+Number(row[field.name]||0).toLocaleString('en-US',{minimumFractionDigits:2})+'</span>';
      } else {
        value.textContent=row[field.name]||'\u2014';
      }
      div.appendChild(label);
      div.appendChild(value);
      content.appendChild(div);
    });

    // Mostrar permisos de edicion
    var canEdit=(me.role==='admin'||me.role==='supervisor'||me.role==='coordinador');
    $('editBtn').style.display=canEdit?'':'none';
    var canDelete=(me.role==='admin'||me.role==='supervisor');
    $('deleteBtn').style.display=canDelete?'':'none';

    $('detailModal').classList.remove('hide');
    editingId=rowId;
  }

  // Aviso flotante no bloqueante (se va solo).
  function toast(texto){
    var el=document.getElementById('toast');
    if(!el){
      el=document.createElement('div'); el.id='toast';
      el.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;'
        +'max-width:92vw;background:#0F172A;color:#fff;padding:12px 16px;border-radius:12px;'
        +'font-size:13px;line-height:1.45;box-shadow:0 10px 30px rgba(15,23,42,.35)';
      document.body.appendChild(el);

    el.textContent=texto; el.style.display='block';

  // ---- Exportaciones ----

  // Exportacion original del modulo de Ventas: una columna por campo del modulo,
  // con el vendedor al inicio y las fechas de creacion/actualizacion al final.
  function exportVentas(){
    if(typeof RainbowXLSX==='undefined'){ alert('No se pudo cargar el generador de Excel. Recarga la página con Ctrl+F5.'); return; }
    if(!moduleSchema || !rows.length){ alert('No hay registros para exportar.'); return; }
    var fields=moduleSchema.schema.fields||[];
    var cols=[{label:'Vendedor',width:24,type:'text'}];
    fields.forEach(function(f){
      cols.push({
        label:f.label,
        width:(f.type==='textarea'?38:(f.type==='number'?22:20)),
        type:(f.type==='date'?'date':(f.type==='number'?'number':'text'))
      });
    });
    cols.push({label:'Creado',width:22,type:'text'},{label:'Actualizado',width:22,type:'text'});
    var data=rows.map(function(r){
      var arr=[ownerNames[r.ownerId]||'—'];
      fields.forEach(function(f){
        var v=r[f.name];
        if(f.type==='number') arr.push(Number(v)||0);
        else arr.push(v==null?'':String(v));
      });
      arr.push(r.createdAt?new Date(r.createdAt).toLocaleString('es-PE'):'');
      arr.push(r.updatedAt?new Date(r.updatedAt).toLocaleString('es-PE'):'');
      return arr;
    });
    RainbowXLSX.descargar(currentModule+'_'+new Date().toISOString().slice(0,10)+'.xlsx',
      [{name:'Registros',cols:cols,rows:data}]);
  }

  // Lista a Excel (schema-driven)
  function exportToList(){
    if(typeof RainbowXLSX==='undefined'){ alert('No se pudo cargar el generador de Excel. Recarga con Ctrl+F5.'); return; }
    if(!moduleSchema || !rows.length){ alert('No hay registros para exportar.'); return; }
    var fields=moduleSchema.schema.fields||[];
    var cols=[{label:'Creado por',width:24,type:'text'}];
    fields.forEach(function(f){
      cols.push({
        label:f.label,
        width:(f.type==='textarea'?38:(f.type==='evaluations'?40:(f.type==='number'?22:20))),
        type:(f.type==='date'?'date':(f.type==='number'?'number':'text'))
      });
    });
    var data=rows.map(function(r){
      var arr=[ownerNames[r.ownerId]||'--'];
      fields.forEach(function(f){
        if(f.type==='evaluations'){
          var evals=r[f.name];
          if(Array.isArray(evals)&&evals.length){
            arr.push(evals.map(function(ev){ return (ev.tipo||'')+' ['+ev.estado+'] planif:'+ev.fechaPlanificada+' real:'+ev.fechaReal+(ev.observaciones?' - '+ev.observaciones:''); }).join('\n'));
          } else arr.push('');
        } else if(f.type==='activities'){
          var acts=r[f.name];
          if(Array.isArray(acts)&&acts.length){
            arr.push(acts.map(function(a){
              return (a.nombre||'')+' | Prog.: '+(a.fechaPlan||'—')
                +(a.tipoFecha==='rango'&&a.fechaPlanFin?' a '+a.fechaPlanFin:'')
                +' | Ejec.: '+(a.fechaEjec||'—')+' | '+(a.ejecutado?'Realizada':'Pendiente');
            }).join('\n'));
          } else arr.push('');
        } else if(f.type==='userselect'){
          var u=moduleUsers.find(function(x){ return x.id===r[f.name]; });
          arr.push(u?u.name:'');
        } else if(f.type==='number'){
          arr.push(Number(r[f.name])||0);
        } else {
          arr.push(r[f.name]==null?'':String(r[f.name]));
        }
      });
      return arr;
    });
    RainbowXLSX.descargar(currentModule+'_lista_'+new Date().toISOString().slice(0,10)+'.xlsx',
      [{name:'Registros',cols:cols,rows:data}]);
  }

  // Cronograma a Excel
  function exportCronograma(){
    if(typeof RainbowXLSX==='undefined'){ alert('No se pudo cargar el generador de Excel.'); return; }
    if(!rows.length){ alert('No hay registros.'); return; }
    var cols=[
      {label:'Producto',width:28,type:'text'},
      {label:'Tipo',width:16,type:'text'},
      {label:'Estado',width:20,type:'text'},
      {label:'Muestras',width:14,type:'date'},
      {label:'Instalacion',width:14,type:'date'},
      {label:'Eval 1',width:14,type:'date'},
      {label:'Eval 2',width:14,type:'date'},
      {label:'Eval 3',width:14,type:'date'},
      {label:'Eval 4',width:14,type:'date'},
      {label:'Informe',width:14,type:'date'},
      {label:'Plaga',width:18,type:'text'},
      {label:'Cultivo',width:18,type:'text'},
      {label:'Ubicacion del ensayo',width:22,type:'text'},
      {label:'Representante',width:20,type:'text'}
    ];
    var data=rows.map(function(r){
      var evalDates=['','','',''];
      if(Array.isArray(r.evaluaciones)){
        r.evaluaciones.forEach(function(ev,i){
          if(i<4) evalDates[i]=ev.fechaReal||ev.fechaPlanificada||'';
        });
      }
      var rep=moduleUsers.find(function(x){ return x.id===(r.representante||r.campo1Rtc); });
      return [
        r.producto||'', r.tipoProducto||'', r.estadoGeneral||'',
        r.fechaMuestras||'', r.fechaInstalacion||'',
        evalDates[0], evalDates[1], evalDates[2], evalDates[3],
        r.fechaInformePlanificada||'',
        r.plaga||'', r.cultivo||'', r.ubicacionEnsayo||'',
        rep?rep.name:''
      ];
    });
    RainbowXLSX.descargar('cronograma_id_'+new Date().toISOString().slice(0,10)+'.xlsx',
      [{name:'Cronograma',cols:cols,rows:data}]);
  }

  // Cumplimiento a Excel
  function exportCumplimiento(){
    if(typeof RainbowXLSX==='undefined'){ alert('No se pudo cargar el generador de Excel.'); return; }
    if(!rows.length){ alert('No hay registros.'); return; }
    var cols=[
      {label:'Producto',width:28,type:'text'},
      {label:'Evaluacion',width:20,type:'text'},
      {label:'Fecha planificada',width:16,type:'date'},
      {label:'Fecha real',width:16,type:'date'},
      {label:'Estado',width:14,type:'text'},
      {label:'Retrasada?',width:12,type:'text'},
      {label:'Observaciones',width:40,type:'text'}
    ];
    var todayISO=new Date().toISOString().slice(0,10);
    var data=[];
    rows.forEach(function(r){
      if(!Array.isArray(r.evaluaciones)||!r.evaluaciones.length){
        data.push([r.producto||'','(sin evaluaciones)','','','','','']);
      } else {
        r.evaluaciones.forEach(function(ev){
          var retrasada=(ev.estado==='Pendiente'&&ev.fechaPlanificada&&ev.fechaPlanificada<todayISO)?'Si':'No';
          data.push([
            r.producto||'', ev.tipo||'', ev.fechaPlanificada||'', ev.fechaReal||'',
            ev.estado||'', retrasada, ev.observaciones||''
          ]);
        });
      }
    });
    // Fila de totales
    var planif=data.filter(function(d){ return d[2]; }).length;
    var real=data.filter(function(d){ return d[3]; }).length;
    var retr=data.filter(function(d){ return d[5]==='Si'; }).length;
    data.push([]);
    data.push(['TOTAL','','','','','', '']);
    data.push(['Planificadas',planif,'','','','','']);
    data.push(['Realizadas',real,'','','','','']);
    data.push(['Retrasadas',retr,'','','','','']);
    data.push(['% Cumplimiento',planif>0?Math.round(real/planif*100)+'%':'0%','','','','','']);

    RainbowXLSX.descargar('cumplimiento_id_'+new Date().toISOString().slice(0,10)+'.xlsx',
      [{name:'Cumplimiento',cols:cols,rows:data}]);
  }

  // Resumen ejecutivo a Excel
  function exportResumenEjec(){
    if(typeof RainbowXLSX==='undefined'){ alert('No se pudo cargar el generador de Excel.'); return; }
    if(!rows.length){ alert('No hay registros.'); return; }
    var states=moduleSchema.schema.states||{};
    var stateValues=states.values||[];
    var stateField=states.field||'estadoGeneral';

    // Hoja 1: Resumen por estado
    var cols1=[{label:'Estado',width:28,type:'text'},{label:'Cantidad',width:12,type:'number'},{label:'%',width:10,type:'text'}];
    var data1=[];
    var total=rows.length;
    stateValues.forEach(function(s){
      var cnt=rows.filter(function(r){ return r[stateField]===s; }).length;
      if(cnt>0) data1.push([s,cnt,total>0?Math.round(cnt/total*100)+'%':'0%']);
    });
    data1.push([]);
    data1.push(['TOTAL',total,'100%']);

    // Hoja 2: Por tipo de producto
    var tipos=['Insecticida','Fungicida','Bioinsumo','Bioestimulante','Micronutriente','Otro'];
    var cols2=[{label:'Tipo de producto',width:22,type:'text'},{label:'Ensayos',width:12,type:'number'},{label:'Completados',width:14,type:'number'},{label:'Activos',width:12,type:'number'},{label:'Suspendidos',width:14,type:'number'}];
    var data2=[];
    tipos.forEach(function(t){
      var ens=rows.filter(function(r){ return r.tipoProducto===t; });
      if(ens.length){
        data2.push([t,ens.length,
          ens.filter(function(r){ return r[stateField]==='Completado'; }).length,
          ens.filter(function(r){ return r[stateField]!=='Completado'&&r[stateField]!=='Suspendido'; }).length,
          ens.filter(function(r){ return r[stateField]==='Suspendido'; }).length
        ]);
      }
    });

    // Hoja 3: Evaluaciones
    var cols3=[{label:'Metrica',width:28,type:'text'},{label:'Valor',width:14,type:'text'}];
    var evalPlan=0,evalReal=0,evalPend=0,evalRetr=0;
    var todayISO=new Date().toISOString().slice(0,10);
    rows.forEach(function(r){
      if(Array.isArray(r.evaluaciones)){
        r.evaluaciones.forEach(function(ev){
          if(ev.fechaPlanificada||ev.fechaReal) evalPlan++;
          if(ev.estado==='Realizada') evalReal++;
          if(ev.estado==='Pendiente'){
            evalPend++;
            if(ev.fechaPlanificada&&ev.fechaPlanificada<todayISO) evalRetr++;
          }
        });
      }
    });
    var data3=[
      ['Total ensayos',String(rows.length)],
      ['Ensayos activos',String(rows.filter(function(r){ return r[stateField]!=='Completado'&&r[stateField]!=='Suspendido'; }).length)],
      ['Ensayos completados',String(rows.filter(function(r){ return r[stateField]==='Completado'; }).length)],
      ['Ensayos suspendidos',String(rows.filter(function(r){ return r[stateField]==='Suspendido'; }).length)],
      ['Evaluaciones planificadas',String(evalPlan)],
      ['Evaluaciones realizadas',String(evalReal)],
      ['Evaluaciones pendientes',String(evalPend)],
      ['Evaluaciones retrasadas',String(evalRetr)],
      ['% Cumplimiento evaluaciones',evalPlan>0?Math.round(evalReal/evalPlan*100)+'%':'0%']
    ];

    RainbowXLSX.descargar('resumen_id_'+new Date().toISOString().slice(0,10)+'.xlsx',
      [
        {name:'Por estado',cols:cols1,rows:data1},
        {name:'Por tipo',cols:cols2,rows:data2},
        {name:'Evaluaciones',cols:cols3,rows:data3}
      ]);
  }

  // Check auth on load
  api('GET','/api/me').then(function(res){
    if(res.ok){ start(res.data.user); }
    else { $('login').classList.remove('hide'); }
  });

})();
</script>
